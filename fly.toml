# fly.toml app configuration file for ndcscore.
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ndcscore'
primary_region = 'syd'

[build.args]
  # Baked into the SPA at build time — the browser talks straight to the
  # Soarscore API (CORS for this origin is configured on the service via
  # SOARSCORE_CORS_ORIGINS).
  VITE_API_BASE = 'https://soarscore2-quiet-shadow-5419.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
