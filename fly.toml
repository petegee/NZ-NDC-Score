# fly.toml app configuration file for ndcscore.
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ndcscore'
primary_region = 'syd'

[build.args]
  # Baked into the SPA at build time — the browser talks straight to the
  # Soarscore API (CORS for this origin is configured on the service via
  # SOARSCORE_CORS_ORIGINS).
  VITE_API_BASE = 'https://soarscore2-quiet-shadow-5419.fly.dev'
  # Auth0 SPA client — public values (the SPA has no secret). AUDIENCE must
  # equal the API's Soarscore__Auth__Audience Fly secret; until it is set the
  # app shows a configuration error naming it.
  VITE_AUTH0_DOMAIN = 'dev-do84ownglbybm3wq.us.auth0.com'
  VITE_AUTH0_CLIENT_ID = 'NnElGNDnDonRvC9mKvzwXisbnkkngJ1N'
  VITE_AUTH0_AUDIENCE = 'soarscore2-quiet-shadow-5419'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
