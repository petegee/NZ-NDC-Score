server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed assets — cache them forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
